<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Document</title>
</head>
<body>
    <p id="intro" class="content">
        This paragraph has both an id and a class attribute.
    </p>

    <a href="https://www.google.com"
       title="Visit Google"
       target="_blank">
       Open Google
    </a>

    <br><br>

    <input type="text"
           placeholder="Enter your name"
           required>

    <br><br>

    <p style="color: blue; font-size: 20px; font-weight: bold;">
        This is a styled paragraph using the style attribute.
    </p>


</body>
</html>
